/* v3.7.5: spaced practice and mastery stages */
function chunkStage(id){
 const p=state.chunkProgress[id], records=state.history.filter(a=>Number(a.id)===Number(id)&&Number.isFinite(Number(a.score)));
 if(!p?.count && !records.length)return '未学習';
 const days=new Set(records.filter(a=>Number(a.score)>=85&&a.date).map(a=>new Date(a.date).toLocaleDateString('sv-SE')));
 return days.size>=2?'習得済み':'練習中';
}
function reviewPriority(c){
 const p=state.chunkProgress[c.id],stage=chunkStage(c.id);
 if(stage==='習得済み')return -100;
 if(stage==='未学習')return 10;
 const best=Number(p?.best||0),last=Number(p?.last??best);
 const lastTime=p?.lastDate?Date.parse(p.lastDate):NaN;
 const elapsed=Number.isFinite(lastTime)?Math.min(30,Math.max(0,(Date.now()-lastTime)/86400000)):5;
 return 60+(100-last)*0.7+(100-best)*0.2+elapsed*2;
}
function beginReview(){
 const candidates=CHUNKS.map((c,i)=>({c,i,weight:reviewPriority(c)})).filter(x=>x.weight>=0);
 if(!candidates.length){alert('すべて習得済みです。通常のチャンク学習で復習できます。');return}
 candidates.sort((a,b)=>b.weight-a.weight||a.i-b.i);
 // 候補の上位5件から選び、同じチャンクへの偏りを軽減
 const previous=Number(state.lastReviewId||0);
 const top=candidates.slice(0,Math.min(5,candidates.length)).filter(x=>x.c.id!==previous);
 const pool=top.length?top:candidates.slice(0,1);
 const selected=pool[Math.floor(Math.random()*pool.length)].c;
 state.lastReviewId=selected.id;state.id=selected.id;state.variant=0;state.answer=0;
 go('pron');
}

function translationTargets(from){

  const p=examplePair(x);
  result.push({source:'exampleQuestion',label:'例文・質問',en:p.question[0],ja:p.question[1]},
              {source:'exampleAnswer',label:'例文・回答',en:p.answer[0],ja:p.answer[1]});

  const p=conversationPair(x);
  result.push({source:'conversationQuestion',label:'AI会話・質問',en:p.question[0],ja:p.question[1]},
              {source:'conversationAnswer',label:'AI会話・回答',en:p.answer[0],ja:p.answer[1]});

  const p=examplePair(x);
  result.push({source:'exampleAnswer',label:'例文・回答',en:p.answer[0],ja:p.answer[1]});
 }
 return result;
}

// English Journey v5.0.0 beta - guided, scripted dialogue. Independent from adventure score.
const EJ_DIALOGUE_KEY='chunkEnglishGuidedDialogueV5';
const ejDialogue=(()=>{try{const o=JSON.parse(localStorage.getItem(EJ_DIALOGUE_KEY)||'{}');return {log:Array.isArray(o.log)?o.log.slice(-100):[],last:o.last||null}}catch{return {log:[],last:null}}})();
let ejDialogueRun=null;
function ejDialogueSave(){try{localStorage.setItem(EJ_DIALOGUE_KEY,JSON.stringify(ejDialogue))}catch(e){console.warn('Dialogue history save unavailable',e)}}
function ejDialogueRounds(){
 const first=conversationPair(item());
 const templates={
  daily:[[['How are you today?','今日はお元気ですか？'],['I’m good, thank you.','元気です、ありがとうございます。']],[['What will you do today?','今日は何をしますか？'],['I’m going to work.','仕事に行く予定です。']]],
  travel:[[['Are you ready to leave?','出発の準備はできていますか？'],['Yes, I’m ready.','はい、準備できています。']],[['Where are you going?','どちらへ向かいますか？'],['I’m going to the station.','駅へ向かいます。']]],
  shopping:[[['Are you looking for something?','何かお探しですか？'],['I’m looking for a bag.','バッグを探しています。']],[['Would you like to see this one?','こちらをご覧になりますか？'],['Yes, please.','はい、お願いします。']]],
  restaurant:[[['Are you ready to order?','注文はお決まりですか？'],['Not yet, thank you.','まだです、ありがとうございます。']],[['Would you like some water?','お水はいかがですか？'],['Yes, please.','はい、お願いします。']]]};
 return [{q:first.question,a:first.answer},...(templates[sceneMode]||templates.daily).map(([q,a])=>({q,a}))];
}
function ejDialogueOpen(){if(rec||audioPhase==='preparing'||audioPhase==='listening')return;ejDialogueRun=null;go('dialogue')}
function ejDialogueStart(length=3){
 if(rec||audioPhase==='preparing'||audioPhase==='listening')return;
 const rounds=ejDialogueRounds();ejDialogueRun={id:state.id,scene:sceneMode,index:0,length:Math.max(1,Math.min(3,Number(length)||3)),rounds,answers:[],showHint:false,finished:false};
 go('dialogue');
}
function ejDialogueIsActive(){return !!(ejDialogueRun&&!ejDialogueRun.finished&&ejDialogueRun.id===state.id&&ejDialogueRun.scene===sceneMode)}
function ejDialogueCurrent(){return ejDialogueIsActive()?ejDialogueRun.rounds[ejDialogueRun.index]:null}
function ejDialogueSpeak(){const c=ejDialogueCurrent();if(c)speakText(c.q[0],'ai')}
function ejDialogueShowHint(){if(!ejDialogueIsActive())return;ejDialogueRun.showHint=!ejDialogueRun.showHint;ejDialogueRender()}
function ejDialogueRecord(heard){
 if(!ejDialogueIsActive())return;
 const run=ejDialogueRun;run.answers[run.index]={text:String(heard||''),score:similarity(run.rounds[run.index].a[0],heard),date:new Date().toISOString()};
 ejDialogueRender();
}
function ejDialogueRetry(){if(!ejDialogueIsActive()||rec||audioPhase==='preparing'||audioPhase==='listening')return;delete ejDialogueRun.answers[ejDialogueRun.index];ejDialogueRender()}
function ejDialogueNext(){
 if(!ejDialogueIsActive()||rec||audioPhase==='preparing'||audioPhase==='listening')return;
 const run=ejDialogueRun;
 if(!run.answers[run.index])run.answers[run.index]={text:'（音声入力をスキップ）',score:null,date:new Date().toISOString()};
 if(run.index+1<run.length){run.index++;run.showHint=false;ejDialogueRender();return}
 run.finished=true;
 const completed={date:new Date().toISOString(),id:run.id,scene:run.scene,length:run.length,answers:run.answers.map((a,i)=>({question:run.rounds[i].q[0],expected:run.rounds[i].a[0],text:a.text,score:a.score}))};
 ejDialogue.last=completed;ejDialogue.log.push(completed);ejDialogue.log=ejDialogue.log.slice(-100);ejDialogueSave();ejDialogueRender();
}
function ejDialogueReset(){if(rec||audioPhase==='preparing'||audioPhase==='listening')return;ejDialogueRun=null;ejDialogueRender()}
function ejDialogueBack(){if(rec||audioPhase==='preparing'||audioPhase==='listening')finishListening();go('conversation')}
function ejDialogueHTML(){
 const run=ejDialogueRun;

function isQuestion(en){let t=en.trim().replace(/[.!]+$/,'');return /\?$/.test(en.trim())||/^(how|what|when|where|why|who|which|can|could|would|will|do|does|did|are|is|have|has|shall|should|may)\b/i.test(t)}
function roleFor(x){return state.role==='auto'?(isQuestion(selected()[0])?'user':'ai'):state.role}
function changeRole(v){state.role=v;state.answer=0;persist();render()}
function expectedReply(text){let t=text.toLowerCase();if(/how about you|how are you|how are you doing/.test(t))return ['I’m doing well, thanks.','元気ですよ、ありがとう。'];if(/what do you think|your opinion/.test(t))return ['I think that’s a good idea.','いい考えだと思います。'];if(/where/.test(t))return ['I’m not sure yet.','まだはっきりわかりません。'];if(/when|what time/.test(t))return ['Tomorrow works for me.','明日なら大丈夫です。'];if(/would you like|do you want|can i|could you|can you|shall we|are you|is it|do you|have you/.test(t))return ['Yes, that sounds good.','はい、いいですね。'];if(/thank/.test(t))return ['You’re welcome.','どういたしまして。'];if(/sorry/.test(t))return ['No problem.','大丈夫ですよ。'];if(/like to|i need|i want/.test(t))return ['Sure, let’s do that.','もちろん、そうしましょう。'];return ['I see. Tell me more.','なるほど。もう少し聞かせてください。']}

function pcmToWav(parts,rate){
 const len=parts.reduce((n,p)=>n+p.length,0);

 v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);
 v.setUint16(34,16,true);word(36,'data');v.setUint32(40,len*2,true);
 let offset=44;
 for(const part of parts)for(let i=0;i<part.length;i++){
  const x=Math.max(-1,Math.min(1,part[i]));v.setInt16(offset,x<0?x*32768:x*32767,true);offset+=2;
 }
 return new Blob([buffer],{type:'audio/wav'});
}
